<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>창우 & 지해 - 사진첩</title>
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; margin: 0; padding: 0; background: #fff; text-align: center; color: #333; }
        .gallery-container { max-width: 500px; margin: 0 auto; position: relative; padding-bottom: 50px; }
        
        /* 헤더 스타일 */
        .header { padding: 20px; position: sticky; top: 0; background: rgba(255, 255, 255, 0.95); z-index: 100; border-bottom: 1px solid #eee; }
        .back-btn { text-decoration: none; color: #8a7b6a; float: left; font-size: 0.9rem; font-weight: bold; cursor: pointer; }
        .title { font-size: 1.1rem; font-weight: bold; margin: 0; color: #8a7b6a; display: inline-block; }

        /* 메인 슬라이더 */
        .slider-wrapper {
            width: 100%;
            height: 75vh;
            max-height: 650px;
            overflow-x: auto;
            display: flex;
            scroll-snap-type: x mandatory;
            scrollbar-width: none;
            -ms-overflow-style: none;
            scroll-behavior: smooth;
        }
        .slider-wrapper::-webkit-scrollbar { display: none; }

        .slide {
            min-width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            scroll-snap-align: center;
            position: relative;
            background: #f9f9f9;
        }

        .slide img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        /* 좌우 네비게이션 버튼 */
        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(138, 123, 106, 0.5);
            color: #fff;
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            font-size: 1.2rem;
            cursor: pointer;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .prev-btn { left: 10px; }
        .next-btn { right: 10px; }

        .counter { font-size: 0.85rem; color: #999; margin-top: 20px; letter-spacing: 1px; }
        footer { padding: 40px 20px; font-size: 0.8rem; color: #aaa; border-top: 1px solid #eee; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="gallery-container">
        <header class="header">
            <div onclick="location.href='index.html'" class="back-btn">⇠ BACK</div>
            <h1 class="title">GALLERY</h1>
        </header>

        <div class="slider-wrapper" id="slider">
            <div class="slide" id="img1">
                <button onclick="moveNoHistory('img20')" class="nav-btn prev-btn">❮</button>
                <img src="gallery/IMG_0781.jpg" alt="사진 1">
                <button onclick="moveNoHistory('img2')" class="nav-btn next-btn">❯</button>
            </div>

            <div class="slide" id="img2">
                <button onclick="moveNoHistory('img1')" class="nav-btn prev-btn">❮</button>
                <img src="gallery/photo02.jpg" alt="사진 2">
                <button onclick="moveNoHistory('img3')" class="nav-btn next-btn">❯</button>
            </div>

            <div class="slide" id="img19">
                <button onclick="moveNoHistory('img18')" class="nav-btn prev-btn">❮</button>
                <img src="images/photo19.jpg" alt="사진 19">
                <button onclick="moveNoHistory('img20')" class="nav-btn next-btn">❯</button>
            </div>

            <div class="slide" id="img20">
                <button onclick="moveNoHistory('img19')" class="nav-btn prev-btn">❮</button>
                <img src="images/photo20.jpg" alt="사진 20">
                <button onclick="moveNoHistory('img1')" class="nav-btn next-btn">❯</button>
            </div>
        </div>

        <p class="counter">좌우로 넘겨서 사진을 감상해 주세요.</p>

        <footer>
            © 2027 Changwoo & Jihae. All rights reserved.
        </footer>
    </div>

    <script>
        /**
         * 히스토리를 쌓지 않고 해당 이미지 ID 위치로 이동하는 함수
         * replace()를 활용하여 현재 주소를 덮어씌웁니다.
         */
        function moveNoHistory(targetId) {
            const url = window.location.origin + window.location.pathname + "#" + targetId;
            location.replace(url);
        }
    </script>
</body>
</html>
