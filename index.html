<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>우리 결혼합니다</title>
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; margin: 0; padding: 0; text-align: center; color: #333; line-height: 1.6; background: #fdfaf7; }
        .container { max-width: 500px; margin: 0 auto; background: #fff; box-shadow: 0 0 10px rgba(0,0,0,0.1); overflow: hidden; }
        
        header { padding: 50px 20px; background: #fff; }
        .title { font-size: 1.2rem; letter-spacing: 2px; color: #8a7b6a; margin-bottom: 20px; }
        .names { font-size: 1.8rem; font-weight: bold; }

        /* 이미지 슬라이드 스타일 */
        .slider-container {
            width: 100%;
            height: 400px; /* 이미지 높이에 맞게 조절하세요 */
            overflow: hidden;
            position: relative;
        }
        .slider-wrapper {
            display: flex;
            width: 300%; /* 이미지 3개 기준 */
            height: 100%;
            animation: slide 12s infinite; /* 12초 동안 무한 반복 */
        }
        .slider-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* 슬라이드 애니메이션 */
        @keyframes slide {
            0% { transform: translateX(0); }
            30% { transform: translateX(0); }
            33% { transform: translateX(-33.33%); }
            63% { transform: translateX(-33.33%); }
            66% { transform: translateX(-66.66%); }
            96% { transform: translateX(-66.66%); }
            100% { transform: translateX(0); }
        }

        .section { padding: 60px 20px; }
        .info { margin-top: 30px; font-size: 1rem; color: #666; }
        
        /* 버튼 공통 스타일 */
        .btn { 
            display: inline-block; 
            padding: 12px 25px; 
            text-decoration: none; 
            border-radius: 5px; 
            margin-top: 20px; 
            font-size: 0.9rem;
            transition: background 0.3s;
        }
        .map-btn { background: #8a7b6a; color: #fff; }
        .gallery-btn { 
            background: #fff; 
            color: #8a7b6a; 
            border: 1px solid #8a7b6a;
            margin-bottom: 40px; 
        }
        .gallery-btn:hover { background: #fdfaf7; }

        footer { padding: 40px; font-size: 0.8rem; color: #aaa; background: #fff; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="title">INVITATION</div>
            <div class="names">임창우 & 김지해</div>
            <p>우리, 결혼합니다</p>
        </header>

        <div class="slider-container">
            <div class="slider-wrapper">
                <img src="wedding_image.png" alt="사진 1">
                <img src="wedding_image.png" alt="사진 2">
                <img src="wedding_image.png" alt="사진 3">
            </div>
        </div>

        <section class="section">
            <p>서로가 마주 보며 다져온 사랑을<br>이제 함께 한곳을 바라보며 걸어가려 합니다.<br>저희의 앞날을 축복해 주세요.</p>
            <div class="info">
                <strong>2027년 4월 3일 토요일 오후 12시 20분</strong><br>
                호텔인터네셔널 5층 그랜드볼룸홀
            </div>
        </section>

        <section class="section" style="background: #fafafa;">
            <div class="title">LOCATION</div>
            <p>경남 창원시 성산구 중앙대로 69</p>
            <a href="https://m.place.naver.com/accommodation/11659084/location?entry=plt&filter=location&selected_place_id=11659084&businessCategory=hotel" class="btn map-btn" target="_blank">지도 보기</a>
        </section>

        <section class="section">
            <div class="title">GALLERY</div>
            <p>저희의 소중한 순간들을 확인해보세요.</p>
            <a href="gallery.html" class="btn gallery-btn">사진첩 보기</a>
        </section>

        <footer>
            © 2027 Changwoo & Jihae. All rights reserved.
        </footer>
    </div>
</body>
</html>
